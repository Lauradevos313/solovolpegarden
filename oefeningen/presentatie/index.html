???
Nostalgie speelt een hele grote rol in waarom retro gaming een boom ervaart, mensen halen herinneringen op en denken terug aan een simpelere tijd
de nostalgie werkt ook als een comfort factor, door stress van het dagelijkse leven eventjes af te nemen en weer terug te gaan naar vroeger.
veel retro games zijn ook alleen fysieke media (als we pirating/emulators even vergeten), waardoor er nog een soort nostalgie factor aan verbonden kan worden.
ook omdat ze fysieke media zijn en niet een key die je krijgt, en vervolgends weer die launcher moet updaten en weer in moet loggen. hebben retro spellen simpelere start requirements (letterlijk plug n play), waardoor mensen ook liever daarnaar 'grijpen' dan een moderne game.
